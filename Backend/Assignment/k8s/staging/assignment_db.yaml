# assignment_db.yaml

apiVersion: v1
kind: Secret
metadata:
  name: assignment-mongodb-secret 
  labels:
    app: assignment-mongo 
type: Opaque
data:
  mongo-root-username: REDACTED
  mongo-root-password: REDACTED
---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: assignment-mongodb-statefulset 
  labels:
    app: assignment-mongo 
spec:
  serviceName: "assignment-mongodb-headless-service" 
  replicas: 1
  selector:
    matchLabels:
      app: assignment-mongo 
  template:
    metadata:
      labels:
        app: assignment-mongo 
    spec:
      containers:
        - name: mongo-container 
          image: mongo:4.4
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: assignment-mongodb-secret
                  key: mongo-root-username
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: assignment-mongodb-secret
                  key: mongo-root-password
          resources:
            requests:
              cpu: "100m"
              memory: "384Mi"
            limits:
              cpu: "200m"
              memory: "768Mi"
          volumeMounts:
            - name: mongo-persistent-storage # Nome più descrittivo e coerente
              mountPath: /data/db

  volumeClaimTemplates:
    - metadata:
        name: mongo-persistent-storage 
      spec:
        accessModes: [ "ReadWriteOnce" ] 
        resources:
          requests:
            storage: 1Gi 
---

apiVersion: v1
kind: Service
metadata:
  name: assignment-mongodb-headless-service # Nome standard per il Service Headless
  labels:
    app: assignment-mongo # Etichetta standard
spec:
  clusterIP: None # Definisce questo come un Service Headless
  selector:
    app: assignment-mongo # Seleziona i Pod dello StatefulSet
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017