# review_app.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: review-app
  labels: # Aggiunte etichette al Deployment per coerenza
    app: review-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: review-app
  template:
    metadata:
      labels:
        app: review-app
    spec:
      containers:
        - name: review-app
          image: gruppo3/reviews:latest
          imagePullPolicy: Always # Buona pratica con :latest
          ports:
            - containerPort: 5003
          env:
            - name: MONGO_HOST
              value: "review-mongodb-headless-service" # Aggiornato per puntare al Headless Service
            - name: MONGO_PORT
              value: "27017"
            - name: MONGO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: review-mongodb-secret # <<< CORRETTO: usa il Secret MongoDB dedicato
                  key: mongo-root-username
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: review-mongodb-secret # <<< CORRETTO: usa il Secret MongoDB dedicato
                  key: mongo-root-password
            - name: AUTHENTICATION_SERVICE_URL
              value: "http://authentication-app-service:5000"
            - name: ASSIGNMENT_SERVICE_URL
              value: "http://assignment-app-service:5001"
            - name: SUBMISSION_SERVICE_URL
              value: "http://submission-app-service:5002"
          resources:
            requests:
              cpu: "63m"
              memory: "256Mi"
            limits:
              cpu: "125m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 5003
            initialDelaySeconds: 200
            periodSeconds: 100
          readinessProbe:
            httpGet:
              path: /health
              port: 5003
            initialDelaySeconds: 200
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: review-app-service # Nome del Service per accedere ad review-app (più esplicito)
  labels: # Aggiunte etichette al Service per coerenza
    app: review-app
spec:
  selector:
    app: review-app
  ports:
    - protocol: TCP
      port: 5003
      targetPort: 5003
  type: ClusterIP