# review_db.yaml

apiVersion: v1
kind: Secret
metadata:
  name: review-mongodb-secret 
  labels:
    app: review-mongo 
type: Opaque
data:
    mongo-root-username: REDACTED
    mongo-root-password: REDACTED
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: review-mongodb-statefulset 
  labels:
    app: review-mongo
spec:
  serviceName: "review-mongodb-headless-service" 
  replicas: 1
  selector:
    matchLabels:
      app: review-mongo 
  template:
    metadata:
      labels:
        app: review-mongo 
    spec:
      containers:
        - name: mongo-container 
          image: mongo:4.4
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: review-mongodb-secret
                  key: mongo-root-username
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: review-mongodb-secret
                  key: mongo-root-password
          resources:
            requests:
              cpu: "125m"
              memory: "768Mi"
            limits:
              cpu: "250m"
              memory: "1229Mi"
          volumeMounts:
            - name: mongo-persistent-storage
              mountPath: /data/db

  volumeClaimTemplates:
    - metadata:
        name: mongo-persistent-storage 
      spec:
        accessModes: [ "ReadWriteOnce" ] 
        resources:
          requests:
            storage: 3Gi 
---
apiVersion: v1
kind: Service
metadata:
  name: review-mongodb-headless-service 
  labels:
    app: review-mongo 
spec:
  clusterIP: None 
  selector:
    app: review-mongo 
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017