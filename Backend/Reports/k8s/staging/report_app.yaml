apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-app
  labels:
    app: report-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: report-app
  template:
    metadata:
      labels:
        app: report-app
    spec:
      containers:
        - name: report-app
          image: gruppo3/reports:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5004
          env:
            - name: ASSIGNMENT_SERVICE_URL
              value: "http://assignment-app-service:5001"
            - name: REVIEW_SERVICE_URL
              value: "http://review-app-service:5003"
            - name: AUTHENTICATION_SERVICE_URL
              value: "http://authentication-app-service:5000"
            - name: SUBMISSION_SERVICE_URL
              value: "http://submission-app-service:5002"
          resources:
            requests:
              cpu: "25m"
              memory: "96Mi"
            limits:
              cpu: "50m"
              memory: "192Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 5004
            initialDelaySeconds: 200
            periodSeconds: 100
          readinessProbe:
            httpGet:
              path: /health
              port: 5004
            initialDelaySeconds: 200
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: report-app-service
  labels:
    app: report-app
spec:
  selector:
    app: report-app
  ports:
    - protocol: TCP
      port: 5004
      targetPort: 5004
  type: ClusterIP