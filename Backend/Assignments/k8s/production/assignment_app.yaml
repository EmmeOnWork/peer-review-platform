# assignment_app.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: assignment-app
  labels: # Aggiunte etichette al Deployment per coerenza
    app: assignment-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: assignment-app
  template:
    metadata:
      labels:
        app: assignment-app
    spec:
      containers:
        - name: assignment-app
          image: gruppo3/assignments:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5001
          env:
            - name: MONGO_HOST
              value: "assignment-mongodb-headless-service" 
            - name: MONGO_PORT
              value: "27017"
            - name: MONGO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: assignment-mongodb-secret 
                  key: mongo-root-username
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: assignment-mongodb-secret 
                  key: mongo-root-password
            - name: AUTHENTICATION_SERVICE_URL
              value: "http://authentication-app-service:5000"
          resources:
            requests:
              cpu: "63m"
              memory: "256Mi"
            limits:
              cpu: "125m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 200
            periodSeconds: 100
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 200
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: assignment-app-service # Nome del Service per accedere ad assignment-app (piÃ¹ esplicito)
  labels: # Aggiunte etichette al Service per coerenza
    app: assignment-app
spec:
  selector:
    app: assignment-app
  ports:
    - protocol: TCP
      port: 5001
      targetPort: 5001
  type: ClusterIP