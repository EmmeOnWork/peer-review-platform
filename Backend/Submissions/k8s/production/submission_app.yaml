apiVersion: apps/v1
kind: Deployment
metadata:
  name: submission-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: submission-app
  template:
    metadata:
      labels:
        app: submission-app
    spec:
      # -------- LA SOLUZIONE CORRETTA: INIT CONTAINERS --------
      # Questi container vengono eseguiti e devono terminare con successo
      # PRIMA che il container principale 'submission-app' venga avviato.
      initContainers:
      - name: wait-for-mongodb
        image: busybox:1.35
        # Comando che attende finché la porta 27017 del servizio MongoDB non è raggiungibile.
        command: ['sh', '-c', 'until nc -z -v submission-mongodb-headless-service 27017; do echo "Waiting for MongoDB..."; sleep 2; done;']
      - name: wait-for-minio
        image: busybox:1.35
        # Comando che attende finché la porta 9000 del servizio MinIO non è raggiungibile.
        command: ['sh', '-c', 'until nc -z -v submission-minio-service 9000; do echo "Waiting for MinIO..."; sleep 2; done;']
      
      # -------- CONTAINER PRINCIPALE DELL'APPLICAZIONE --------
      containers:
        - name: submission-app
          image: gruppo3/submissions:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5002
          env:
            - name: MONGO_HOST
              value: "submission-mongodb-headless-service"
            - name: MONGO_PORT
              value: "27017"
            - name: MONGO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: submission-mongodb-secret
                  key: mongo-root-username
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: submission-mongodb-secret
                  key: mongo-root-password
            - name: MONGO_DB_NAME
              value: "submissiondb"
            - name: MINIO_ENDPOINT
              value: "submission-minio-service:9000"
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: submission-minio-secret
                  key: minio-access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: submission-minio-secret
                  key: minio-secret-key
            - name: MINIO_BUCKET_NAME
              value: "submissions"
            - name: ASSIGNMENT_SERVICE_URL
              value: "http://assignment-app-service:5001"
            - name: AUTHENTICATION_SERVICE_URL
              value: "http://authentication-app-service:5000"
          resources:
            requests:
              cpu: "63m"
              memory: "256Mi"
            limits:
              cpu: "125m"
              memory: "512Mi"
          
          # Ora che usiamo Init Containers, possiamo usare ritardi più bassi e ragionevoli.
          livenessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 200
            periodSeconds: 100
          readinessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 200 
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: submission-app-service
spec:
  selector:
    app: submission-app
  ports:
    - protocol: TCP
      port: 5002
      targetPort: 5002
  type: ClusterIP