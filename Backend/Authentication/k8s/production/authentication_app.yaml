apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentication-app
  labels:
    app: authentication-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: authentication-app
  template:
    metadata:
      labels:
        app: authentication-app
    spec:
      containers:
        - name: authentication-app
          image: gruppo3/authentication:latest
          ports:
            - containerPort: 5000
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
            - name: POSTGRES_HOST
              value: "postgres-headless-service"
            - name: POSTGRES_PORT
              value: "5432"
          resources: # Pesi aggiornati
            requests:
              cpu: "50m"
              memory: "192Mi"
            limits:
              cpu: "100m"
              memory: "384Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30  # Aumentato da 10
            periodSeconds: 10        # Aumentato da 5
            timeoutSeconds: 5        # Aggiunto timeout
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15  # Aumentato da 5
            periodSeconds: 10        # Aumentato da 5
            timeoutSeconds: 5        # Aggiunto timeout

---

apiVersion: v1
kind: Service
metadata:
  name: authentication-app-service
spec:
  selector:
    app: authentication-app
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
  type: ClusterIP