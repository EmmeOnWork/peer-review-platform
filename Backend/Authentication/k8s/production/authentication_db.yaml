apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  labels:
    app: authentication-db
type: Opaque
data:
  POSTGRES_USER: REDACTED
  POSTGRES_PASSWORD: REDACTED
  POSTGRES_DB: YXV0aF9kYg==

---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-statefulset
  labels:
    app: authentication-db
spec:
  serviceName: "postgres-headless-service"
  replicas: 1
  selector:
    matchLabels:
      app: authentication-db
  template:
    metadata:
      labels:
        app: authentication-db
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
          resources:
            requests:
              cpu: "150m"
              memory: "768Mi"
            limits:
              cpu: "300m"
              memory: "1.2Gi"
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi

---

apiVersion: v1
kind: Service
metadata:
  name: postgres-headless-service
  labels:
    app: authentication-db
spec:
  clusterIP: None
  selector:
    app: authentication-db
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432