apiVersion: v1
kind: Secret
metadata:
  name: pre-release-tls-secret
  namespace: pre-release
type: kubernetes.io/tls
data:
  tls.crt: REDACTED
  tls.key: REDACTED
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-prerelease
  namespace: pre-release 
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true" 
    nginx.ingress.kubernetes.io/rewrite-target: / # Inoltra tutto così com'è al tuo Nginx frontend
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - pre-release.peer-review
      secretName: pre-release-tls-secret 
  rules:
    - host: pre-release.peer-review
      http:
        paths:
          - path: / # Cattura TUTTO il traffico per questo host
            pathType: Prefix 
            backend:
              service:
                name: frontend-service
                port:
                  number: 80 # La porta del Service K8s del tuo Nginx customizzato
             