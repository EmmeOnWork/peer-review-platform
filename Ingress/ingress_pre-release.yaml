apiVersion: v1
kind: Secret
metadata:
  name: pre-release-tls-secret
  namespace: pre-release
type: kubernetes.io/tls
data:
  tls.crt: REDACTED
  tls.key: REDACTED
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-prerelease
  namespace: pre-release
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  tls:
    - hosts:
        - pre-release.peer-review
      secretName: pre-release-tls-secret
  rules:
    - host: pre-release.peer-review
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
             