apiVersion: v1
kind: Secret
metadata:
  name: production-tls-secret
  namespace: production # Deve essere la stessa namespace dell'Ingress e dei servizi target
type: kubernetes.io/tls
data:
  tls.crt: REDACTED
  tls.key: REDACTED
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: production-app-ingress
  namespace: production  # Namespace dedicato alla produzione
  annotations:
    # Specifica che questo Ingress deve essere gestito dall'Ingress Controller Nginx
    kubernetes.io/ingress.class: "nginx" 

    # --- Policy TLS/HTTPS ---
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

    # --- Gestione dei Path ---
    # Abilita l'uso di espressioni regolari nei path, utile per regole più complesse.
    nginx.ingress.kubernetes.io/use-regex: "true"

    # Riscrive il path prima di inviarlo al backend.
    nginx.ingress.kubernetes.io/rewrite-target: / 

    # --- Performance ---
    # Abilita la compressione GZIP per i tipi di contenuto specificati.
    nginx.ingress.kubernetes.io/use-gzip: "true"
    nginx.ingress.kubernetes.io/gzip-types: "application/javascript application/json application/xml text/css text/plain text/xml image/svg+xml"

    # --- Limiti ---
    # Limita la dimensione massima del corpo delle richieste (es. per upload).
    nginx.ingress.kubernetes.io/proxy-body-size: "10m" 

spec:
  ingressClassName: nginx # Consigliato per specificare esplicitamente il controller
  
  # --- Configurazione TLS (HTTPS) ---
  # Se vuoi abilitare HTTPS, DECOMMENTA e configura questa sezione.
  # Assicurati che il secret 'production-tls-secret' esista nella namespace 'production'
  # e contenga un certificato valido per 'peer-review.tuodominio.local'.
  # Se questa sezione è presente e force-ssl-redirect è "true", tutto sarà HTTPS.
  # Se questa sezione è presente e force-ssl-redirect è "false", HTTPS sarà disponibile ma non forzato.
  # Se questa sezione è commentata, HTTPS non sarà disponibile tramite questo Ingress.
  tls:
  - hosts:
      - peer-review
    secretName: production-tls-secret

  rules:
  - host: peer-review
    http:
      paths:
      # Questa unica regola instrada TUTTO il traffico per l'host specificato
      # al 'frontend-service'. Questo implica che 'frontend-service' (il tuo Nginx)
      # è responsabile di:
      #   1. Servire i file statici della SPA Vue.js.
      #   2. Agire come reverse proxy per TUTTE le chiamate API ai tuoi microservizi backend.
      - path: /                  # Cattura tutti i path (root e sotto-path)
        pathType: Prefix       # Matching di tipo prefix
        backend:
          service:
            name: frontend-service # Service Kubernetes del tuo Nginx+Vue frontend nella namespace 'production'
            port:
              number: 80         # Porta del service 'frontend-service' (che mappa alla containerPort 80 di Nginx)

          