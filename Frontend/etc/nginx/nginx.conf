# Imposta il numero di worker processes in base ai core disponibili.
worker_processes auto;

# File per memorizzare il Process ID di NGINX
pid /var/run/nginx.pid;

# Log degli errori: utile per il debug di NGINX stesso. 'warn' è un buon livello per la produzione.
error_log /var/log/nginx/error.log warn;

events {
    # Numero massimo di connessioni che un singolo worker process può gestire.
    worker_connections 1024;
}

http {
    # Carica i tipi MIME standard per i file statici.
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Formato standard per i log di accesso.
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Ottimizzazioni per l'invio di file e la gestione delle connessioni TCP.
    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;

    # Abilita la compressione Gzip per ridurre la dimensione delle risposte e migliorare i tempi di caricamento.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/xml text/xml image/svg+xml;

    server {
        listen 80;
        server_name localhost;

        # Directory root per i file del frontend.
        root /usr/share/nginx/html;
        index index.html index.htm;

        # ================================================
        # 1. GESTIONE DEL FRONTEND (Single Page Application)
        # ================================================
        # Qualsiasi richiesta che non corrisponde a un file o a una directory fisica
        # viene reindirizzata a /index.html per permettere il routing lato client (es. Vue Router).
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ================================================
        # 2. HEALTH CHECK PER NGINX STESSO
        # ================================================
        # Risponde direttamente senza inoltrare la richiesta, utile per monitorare NGINX.
        location = /health {
            access_log off;
            return 200 'nginx-ok';
            add_header Content-Type text/plain;
        }

        # ================================================
        # 3. ROUTING DINAMICO PER TUTTI I MICROSERVIZI
        # ================================================
        # Questo blocco cattura tutte le richieste che iniziano con i prefissi dei tuoi servizi.
        location ~ ^/(auth|assignments|submissions|reviews) {

            # --- A. Riscrive l'URI per rimuovere il prefisso del servizio ---
            # Questo permette di avere un'API pulita nel backend (es. /health invece di /assignments/health).
            # Esempio: una richiesta a "/assignments/123" viene riscritta internamente in "/123".
            # Il 'break' è cruciale per fermare l'elaborazione delle rewrite e rimanere in questa location.
            rewrite ^/[^/]+(/.*)$ $2 break;

            # --- B. Imposta la variabile del backend in base al prefisso originale ---
            # La variabile $1 viene dal primo gruppo di cattura nella 'location' (auth|assignments|...).
            set $backend_service "";
            if ($1 = "auth") {
                set $backend_service "http://authentication-app-service:5000";
            }
            if ($1 = "assignments") {
                set $backend_service "http://assignment-app-service:5001";
            }
            if ($1 = "submissions") {
                set $backend_service "http://submission-app-service:5002";
            }
            if ($1 = "reviews") {
                set $backend_service "http://review-app-service:5003";
            }

            # Sicurezza: se nessun backend corrisponde, non procedere.
            if ($backend_service = "") {
                return 404;
            }

            # --- C. Imposta gli header da inoltrare al backend ---
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Inoltra esplicitamente il token di autorizzazione se presente.
            proxy_set_header Authorization     $http_authorization;

            # Configurazioni per supportare WebSocket e connessioni persistenti.
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";

            # Timeout per una migliore gestione degli errori e della resilienza.
            proxy_connect_timeout  10s;
            proxy_read_timeout     90s;
            
            # --- D. Inoltra la richiesta al backend corretto ---
            # Usa la variabile del backend e l'URI riscritto ($uri).
            # Questo risolve l'errore di sintassi e instrada correttamente la richiesta.
            proxy_pass $backend_service$uri;
        }

        # ========== 4. GESTIONE PAGINE DI ERRORE ==========
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}