worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Mappa i path al servizio backend
    map $uri $backend_service {
        default                         "";
        ~^/auth(/|$)                    "http://authentication-app-service:5000";
        ~^/assignments(/|$)             "http://assignment-app-service:5001";
        ~^/submissions(/|$)             "http://submission-app-service:5002";
        ~^/reviews(/|$)                 "http://review-app-service:5003";
    }

    server {
        listen 80;
        server_name peer-review;

        # Blocca richieste alla root
        location = / {
            return 403;
        }

        # Gestione delle richieste ai microservizi
        location ~ ^/(auth|assignments|submissions|reviews)(/.*)?$ {
            # Rimuove il prefisso dal path
            rewrite ^/[^/]+(/.*)$ $1 break;

            # Blocca se il backend non è stato definito
            if ($backend_service = "") {
                return 404;
            }

            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization     $http_authorization;

            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";

            proxy_connect_timeout  10s;
            proxy_read_timeout     90s;

            proxy_pass $backend_service$uri;
        }

        # Catch-all: restituisce 404 per altri percorsi
        location / {
            return 404;
        }
    }
}
