# Imposta il numero di processi worker. 'auto' è una scelta robusta per ambienti
# containerizzati, in quanto si adatta al numero di core disponibili.
worker_processes auto;

# Logga gli errori globali su stderr, in modo che possano essere raccolti
# dal sistema di logging del container (es. Docker, Kubernetes).
# Il livello 'warn' è un buon compromesso tra verbosità e utilità.
error_log       /dev/stderr warn;

# Blocco di configurazione per la gestione delle connessioni di rete.
events {
    # Numero massimo di connessioni simultanee per ogni processo worker.
    worker_connections 1024;
}

# Blocco principale di configurazione per il protocollo HTTP.
http {
    # Includi un file con la mappatura delle estensioni dei file ai tipi MIME corretti.
    # Questo assicura che il browser interpreti correttamente i file (es. .css, .js).
    include       /etc/nginx/mime.types;
    # Tipo di contenuto di default se il tipo di un file non può essere determinato.
    default_type  application/octet-stream;

    # Logga le richieste di accesso su stdout, per essere raccolte dal sistema di logging del container.
    access_log      /dev/stdout;

    # Ottimizzazioni per l'invio di file statici.
    # 'sendfile on' permette al kernel di inviare i file direttamente, bypassando lo user-space.
    sendfile        on;
    # 'tcp_nopush on' ottimizza l'invio di pacchetti di rete, inviando gli header e l'inizio del file
    # in un unico pacchetto.
    tcp_nopush      on;

    # Impostazioni di compressione Gzip. Riducono la dimensione delle risposte testuali
    # (HTML, CSS, JS, JSON), velocizzando il caricamento per l'utente finale.
    gzip on;
    gzip_vary on; # Aggiunge l'header 'Vary: Accept-Encoding' per le cache intermedie.
    gzip_proxied any; # Comprime anche le risposte provenienti da server proxy.
    gzip_comp_level 6; # Livello di compressione (1-9). 6 è un buon equilibrio tra compressione e uso della CPU.
    gzip_min_length 256; # Non comprimere file più piccoli di 256 byte.
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # ==========================================================
    # Definizione del Server Virtuale Principale
    # ==========================================================
    server {
        # Ascolta sulla porta 80. L'Ingress Controller contatterà questo pod su questa porta.
        listen 80;
        
        # Il nome del server non è critico quando si è dietro un proxy come Kubernetes Service.
        server_name localhost;

        # Specifica la directory root dove si trovano i file compilati della tua SPA (es. la cartella 'dist' di Vue).
        # Questo percorso deve corrispondere a dove copi i file nel tuo Dockerfile.
        root /usr/share/nginx/html;

        # ==========================================================
        # Blocco #1: Gestione della Single Page Application
        # ==========================================================
        location / {
            # File di default da servire quando si richiede una directory (tipicamente la root '/').
            index index.html index.htm;
            
            # Questa linea è FONDAMENTALE per il corretto funzionamento delle SPA.
            # 1. Tenta di servire il file richiesto esattamente come è ($uri). Es: /assets/logo.png
            # 2. Se non lo trova, prova a vedere se è una directory ($uri/). Es: /admin/ (cercherà /admin/index.html)
            # 3. Se falliscono entrambi i tentativi, invece di restituire 404, serve /index.html.
            # Questo permette al router lato client (Vue Router) di intercettare l'URL (es. /teacher/dashboard)
            # e di renderizzare la vista corretta senza che il server cerchi un file inesistente.
            try_files $uri $uri/ /index.html;
        }

        # ==========================================================
        # Blocco #2: Health Check per il container Nginx stesso
        # ==========================================================
        # Questo endpoint può essere usato dalle sonde Liveness e Readiness di Kubernetes
        # per verificare che il processo Nginx sia in esecuzione e risponda.
        location = /health {
            # Disabilita il logging per queste richieste per mantenere i log puliti.
            access_log off;
            
            # Aggiunge un header per indicare che non deve essere cachato.
            add_header 'Content-Type' 'text/plain';
            
            # Restituisce una risposta semplice, veloce e testuale.
            return 200 'nginx-ok';
        }
    }
}