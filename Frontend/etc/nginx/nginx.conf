# Numero di processi worker: 'auto' sceglie in base ai core CPU disponibili
worker_processes auto;

# File PID e log degli errori
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    # Numero massimo di connessioni per worker
    worker_connections 1024;
}

http {
    # Tipi MIME standard per file statici
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging accessi
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # Ottimizzazioni per file statici
    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;

    # Compressione Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/xml text/xml image/svg+xml;

    # === MAPPATURA URI -> SERVIZI BACKEND ===
    map $request_uri $backend_host {
        default                          "";
        ~^/auth        http://authentication-app-service:5000;
        ~^/assignments http://assignment-app-service:5001;
        ~^/submissions http://submission-app-service:5002;
        ~^/reviews     http://review-app-service:5003;
    }

    server {
        listen 80;
        server_name localhost;

        # Radice per il frontend statico
        root /usr/share/nginx/html;
        index index.html index.htm;

        # === 1. GESTIONE SPA FRONTEND ===
        location / {
            try_files $uri $uri/ /index.html;
        }

        # === 2. HEALTH CHECK ===
        location = /health {
            access_log off;
            return 200 'nginx-ok';
            add_header Content-Type text/plain;
        }

        # === 3. ROUTING API VERSO BACKEND ===
        location ~ ^/(auth|assignments|submissions|reviews) {
            # Se non è stato risolto un backend valido, ritorna errore
            if ($backend_host = "") {
                return 404;
            }

            # Headers standard per proxy
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization     $http_authorization;

            # WebSocket compatibility (anche se non usata subito)
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";

            # Timeout e buffer disattivati
            proxy_read_timeout     90s;
            proxy_connect_timeout  10s;
            proxy_redirect         off;
            proxy_buffering        off;

            # Inoltro dinamico alla variabile mappata
            proxy_pass $backend_host;
        }

        # === 4. ERRORI PERSONALIZZATI ===
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
