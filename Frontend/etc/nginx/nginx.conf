worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile on;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/xml text/xml image/svg+xml;

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html index.htm;

        # Frontend SPA Vue.js
        location / {
            try_files $uri $uri/ /index.html;
        }

        # # Passaggio header importanti per backend e websocket
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # =====================================
        # HEALTH CHECK ENDPOINTS
        # =====================================
        
        # Auth Service Health Check
        location /auth/health {
            proxy_pass http://authentication-app-service:5000/health;
            proxy_http_version 1.1;
            proxy_redirect off;
            proxy_buffering off;
            access_log off;  # Non loggare i health check
        }

        # Assignment Service Health Check  
        location /assignments/health {
            proxy_pass http://assignment-app-service:5001/health;
            proxy_http_version 1.1;
            proxy_redirect off;
            proxy_buffering off;
            access_log off;
        }

        # Submission Service Health Check
        location /submissions/health {
            proxy_pass http://submission-app-service:5002/health;
            proxy_http_version 1.1;
            proxy_redirect off;
            proxy_buffering off;
            access_log off;
        }

        # # Reviews Service Health Check
        # location /reviews/health {
        #     proxy_pass http://review-app-service:5003/health;
        #     proxy_http_version 1.1;
        #     proxy_redirect off;
        #     proxy_buffering off;
        #     access_log off;
        # }
        
        # # Reports Service Health Check  
        # location /reports/health {
        #     proxy_pass http://report-app-service:5004/health;
        #     proxy_http_version 1.1;
        #     proxy_redirect off;
        #     proxy_buffering off;
        #     access_log off;
        # }

        # =====================================
        # REGULAR SERVICE ENDPOINTS
        # =====================================

        # Auth Service
        location /auth/ {
            proxy_pass http://authentication-app-service:5000/auth/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_redirect off;
            proxy_buffering off;
        }


        location /assignments/ {
            proxy_pass http://assignment-app-service:5001/assignments/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_redirect off;
            proxy_buffering off;
        }

        location /assignments {
            proxy_pass http://assignment-app-service:5001/assignments;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_redirect off;
            proxy_buffering off;
        }



        location /submissions/ {
            proxy_pass http://submission-app-service:5002/submissions/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_redirect off;
            proxy_buffering off;
        }


        location /submissions {
            proxy_pass http://submission-app-service:5002/submissions;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_redirect off;
            proxy_buffering off;
        }

        # # Reviews Service
        # location /reviews/ {
        #     proxy_pass http://review-app-service:5003/reviews/;
        #     proxy_http_version 1.1;
        #     proxy_set_header Upgrade $http_upgrade;
        #     proxy_set_header Connection "upgrade";
        #     proxy_redirect off;
        #     proxy_buffering off;
        # }

        # # Reports Service
        # location /reports/ {
        #     proxy_pass http://report-app-service:5004/reports/;
        #     proxy_http_version 1.1;
        #     proxy_set_header Upgrade $http_upgrade;
        #     proxy_set_header Connection "upgrade";
        #     proxy_redirect off;
        #     proxy_buffering off;
        # }


        # Health check per nginx stesso
        location /health/ {
            access_log off;
            return 200 'nginx-ok';
            add_header Content-Type text/plain;
        }
        
        location /health {
            access_log off;
            return 200 'ok';
            add_header Content-Type text/plain;
        }
    }
}

