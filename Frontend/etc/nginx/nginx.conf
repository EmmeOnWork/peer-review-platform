worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Inclusione dei tipi MIME, impostazioni di log e performance.
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    access_log      /dev/stdout;
    error_log       /dev/stderr;

    # Impostazioni di compressione Gzip per ridurre la dimensione delle risposte.
    gzip on;
    gzip_vary on;

    server {
        listen 80;
        server_name localhost;

        # ==========================================================
        # HEADER GLOBALI PER TUTTE LE RICHIESTE PROXY
        # ==========================================================
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        # ==========================================================
        # GESTIONE FRONTEND E HEALTH CHECK DI NGINX
        # ==========================================================
        
        # Risponde alle sonde di liveness/readiness per Nginx stesso.
        location = /health {
            access_log off;
            return 200 'nginx-ok';
        }

        # Serve la tua Single Page Application (Vue, React, etc.)
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # ==========================================================
        # HEALTH CHECKS PER I SINGOLI MICROSERVIZI
        #
        # Questi blocchi specifici hanno la prioritÃ  e mappano
        # /<servizio>/health -> http://<backend>/health
        # ==========================================================
        location = /assignments/health {
            access_log off;
            proxy_pass http://assignment-app-service:5001/health;
        }
        location = /submissions/health {
            access_log off;
            proxy_pass http://submission-app-service:5002/health;
        }
        location = /reviews/health {
            access_log off;
            proxy_pass http://review-app-service:5003/health;
        }
        location = /auth/health {
            access_log off;
            proxy_pass http://authentication-app-service:5000/health;
        }
        
        # ==========================================================
        # ROUTING DELLE CHIAMATE API
        # ==========================================================

        # --- Auth Service ---
        location /auth/ {
            proxy_pass http://authentication-app-service:5000/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
        
        # --- Assignments Service ---
        # Blocco per /assignments -> /assignment
        location = /assignments {
            proxy_pass http://assignment-app-service:5001/assignment;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
        # Blocco per /assignments/{id} -> /assignment/{id}
        location /assignments/ {
             rewrite ^/assignments/(.*)$ /assignment/$1 break;
             proxy_pass http://assignment-app-service:5001;
        }

        # --- Submissions Service ---
        # Blocco per /submissions -> /submission
        location = /submissions {
            proxy_pass http://submission-app-service:5002/submission;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
        # Blocco per /submissions/{id} -> /submission/{id}
        location /submissions/ {
             rewrite ^/submissions/(.*)$ /submission/$1 break;
             proxy_pass http://submission-app-service:5002;
        }

        # --- Reviews Service ---
        # Blocco per /reviews -> /review
        location = /reviews {
            proxy_pass http://review-app-service:5003/review;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
        # Blocco per /reviews/{id} -> /review/{id}
        location /reviews/ {
             rewrite ^/reviews/(.*)$ /review/$1 break;
             proxy_pass http://review-app-service:5003;
        }
    }
}
