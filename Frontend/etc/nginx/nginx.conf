worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/xml text/xml image/svg+xml;

    # === Mappa il prefisso URI al backend corretto ===
    map $uri $backend_service {
        default "";
        ~^/auth         http://authentication-app-service:5000;
        ~^/assignments  http://assignment-app-service:5001;
        ~^/submissions  http://submission-app-service:5002;
        ~^/reviews      http://review-app-service:5003;
    }

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html index.htm;

        # --- Frontend SPA routing ---
        location / {
            try_files $uri $uri/ /index.html;
        }

        # --- Health check ---
        location = /health {
            access_log off;
            return 200 'nginx-ok';
            add_header Content-Type text/plain;
        }

        # --- Routing per API backend ---
        location ~ ^/(auth|assignments|submissions|reviews) {

            # Stop immediato se la mappa non ha trovato corrispondenze
            if ($backend_service = "") {
                return 404;
            }

            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization     $http_authorization;

            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";

            proxy_connect_timeout  10s;
            proxy_read_timeout     90s;

            proxy_redirect         off;
            proxy_buffering        off;

            # Non include $uri o / riscritti per evitare errori con regex
            proxy_pass $backend_service;
        }

        # --- Error page ---
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
