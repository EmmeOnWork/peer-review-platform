worker_processes auto; # Lascia che NGINX scelga il numero ottimale di worker

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Impostazioni di base per performance e sicurezza
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Compressione Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/xml text/xml image/svg+xml;

    server {
        listen 80;
        server_name localhost;

        # Root per i file statici del frontend
        root /usr/share/nginx/html;
        index index.html index.htm;

        # ================================================
        # 1. GESTIONE DEL FRONTEND (Single Page App)
        # ================================================
        # Qualsiasi richiesta che non corrisponde a un file o a una directory
        # viene reindirizzata a /index.html per permettere il routing lato client.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ================================================
        # 2. GESTIONE DEGLI ENDPOINT DI HEALTH CHECK
        # ================================================
        
        # Health check per NGINX stesso (corrispondenza esatta e veloce)
        location = /health {
            access_log off;
            return 200 'nginx-ok';
            add_header Content-Type text/plain;
        }

        # Health check per i servizi di backend.
        # Usa un'espressione regolare per catturarli tutti in un colpo solo.
        location ~ ^/(auth|assignments|submissions|reviews)/health$ {
            # Non loggare queste richieste per non sporcare i log
            access_log off;

            # Direttive di base per il proxy
            proxy_set_header Host $http_host;
            proxy_http_version 1.1;
            proxy_redirect off;
            proxy_buffering off;
            
            # Logica per instradare al servizio corretto
            if ($1 = "auth") {
                proxy_pass http://authentication-app-service:5000/health;
            }
            if ($1 = "assignments") {
                proxy_pass http://assignment-app-service:5001/health;
            }
            if ($1 = "submissions") {
                proxy_pass http://submission-app-service:5002/health;
            }
            if ($1 = "reviews") {
                proxy_pass http://review-app-service:5003/health;
            }
        }
        
        # ================================================
        # 3. GESTIONE DI TUTTE LE ALTRE CHIAMATE API (ENDPOINT PROTETTI)
        # ================================================
        # Questo blocco cattura tutte le richieste che iniziano con /auth/, /assignments/, ecc.
        # (escluse quelle che terminano con /health, già gestite sopra).
        location ~ ^/(auth|assignments|submissions|reviews)/ {
            # --- LE DIRETTIVE PROXY VANNO QUI DENTRO ---
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme; # Usa $scheme invece di header non standard
            
            # --- PROPAGAZIONE ESPLICITA DEL TOKEN DI AUTENTICAZIONE ---
            proxy_set_header Authorization $http_authorization;

            # Header necessari per WebSocket (buona pratica)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Altre impostazioni di proxy
            proxy_redirect off;
            proxy_buffering off;
            
            # Logica per instradare al servizio corretto
            # La variabile $1 contiene il nome del servizio catturato dalla regex (es. "assignments")
            if ($1 = "auth") {
                proxy_pass http://authentication-app-service:5000$request_uri;
            }
            if ($1 = "assignments") {
                proxy_pass http://assignment-app-service:5001$request_uri;
            }
            if ($1 = "submissions") {
                proxy_pass http://submission-app-service:5002$request_uri;
            }
            if ($1 = "reviews") {
                proxy_pass http://review-app-service:5003$request_uri;
            }
        }
    }
}