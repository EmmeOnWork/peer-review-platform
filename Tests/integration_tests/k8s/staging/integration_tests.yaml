apiVersion: batch/v1 
kind: Job
metadata:
  name: integration-tests
spec:
  template:
    spec: 
      containers:
      - name: integration 
        image: gruppo3/tests:latest 
        command: ["pytest", "integration_tests/"]
        env:
        - name: AUTHENTICATION_SERVICE_URL
          value: "http://authentication-app-service:5000"

      restartPolicy: Never